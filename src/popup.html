<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <header>
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <h3>FAĞIR</h3>
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <select id="select-favicon" title="Favicon service">
          <option value="disabled">Favicons: Off</option>
          <option value="vemetric">Vemetric</option>
          <option value="favicone">Favicone</option>
        </select>
        <a class="btn" href="https://github.com/rvfet/fagir" style="font-size: 0.75rem; text-decoration: none; font-weight: 600;">
          <svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><title>GitHub</title><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
          Source code
        </a>
      </div>
    </div>
    <p>Strip the malice off of the modern web and make it fağır again.</p>

    <nav>
      <button id="btn-probe" type="button" style="background: hsl(var(--alive)/30%); color: hsl(var(--alive))">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="m730-621-74 38q-11 6-21-1.5t-8-19.5l14-80q1-5-.5-10t-5.5-8l-60-57q-9-9-5.5-20.5T586-793l83-12q4-1 15-11l38-73q6-11 18.5-11t17.5 11l37 73q1 3 15 11l82 12q13 2 17 13.5t-5 20.5l-60 57q-2 2-6 18l14 80q2 12-8.5 19.5T822-583l-73-38q-2-1-19 0ZM480-480Zm120 360H360q-50 0-90-27.5T212-219q19-7 37-15.5t36-17.5q9 23 29 37.5t46 14.5h240q33 0 56.5-23.5T680-280v-199h80v199q0 66-47 113t-113 47ZM480-480ZM122-282q-38 0-59.5-21T41-361q0-66 54-143t105-128v-48q0-66 47-113t113-47h121v80H360q-33 0-56.5 23.5T280-680v270q72-38 138-78.5T548-576q9-6 16.5-4.5T577-573q5 6 4.5 14t-8.5 15q-71 57-142.5 109.5T280-339q-35 19-77 38t-81 19Zm-2-78q20 0 40-4t40-11v-119q-32 35-51.5 67.5T120-360Z"/></svg>
        Probe all hosts
      </button>

      <div class="nav-group">
        <button id="btn-import" type="button" style="flex: 1;">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M440-200h80v-167l64 64 56-57-160-160-160 160 57 56 63-63v167ZM240-80q-33 0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5 56.5T720-80H240Zm280-520v-200H240v640h480v-440H520ZM240-800v200-200 640-640Z"/></svg>
          Import
        </button>
        <button id="btn-export" type="button" style="flex: 1;">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="m720-120 160-160-56-56-64 64v-167h-80v167l-64-64-56 56 160 160ZM560 0v-80h320V0H560ZM240-160q-33 0-56.5-23.5T160-240v-560q0-33 23.5-56.5T240-880h280l240 240v121h-80v-81H480v-200H240v560h240v80H240Zm0-80v-560 560Z"/></svg>
          Export
        </button>
      </div>

      <button id="btn-reset" type="button" style="background: hsl(var(--dead)/30%); color: hsl(var(--dead))">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M520-330v-60h160v60H520Zm60 210v-50h-60v-60h60v-50h60v160h-60Zm100-50v-60h160v60H680Zm40-110v-160h60v50h60v60h-60v50h-60Zm111-280h-83q-26-88-99-144t-169-56q-117 0-198.5 81.5T200-480q0 72 32.5 132t87.5 98v-110h80v240H160v-80h94q-62-50-98-122.5T120-480q0-75 28.5-140.5t77-114q48.5-48.5 114-77T480-840q129 0 226.5 79.5T831-560Z"/></svg>
        Reset to defaults
      </button>
    </nav>

    <progress id="probe-progress" value="0" max="100" hidden></progress>
    <input type="file" id="file-import" accept=".json" hidden>
  </header>

  <main id="routes-container"></main>

  <details style="margin: 1rem 0;">
    <summary><strong>+ Add new rule</strong></summary>
    <form id="form-new-route" style="display: flex; flex-direction: column; gap: 0.5rem; padding: 0.75rem;">
      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem;">
        <input type="text" id="new-name" placeholder="Name (e.g. piped)" required>
        <input type="text" id="new-pattern" placeholder="Regex (e.g. (?:^|\.)youtube\.com$)" required>
        <input type="text" id="new-favicon-domain" placeholder="Favicon domain (optional)">
      </div>
      <div style="display: grid; grid-template-columns: 1fr auto; gap: 0.5rem;">
        <input type="url" id="new-instance" placeholder="Target base (e.g. https://piped.video)" required>
        <button type="submit">Add Route</button>
      </div>
    </form>
  </details>

  <script src="van.min.js"></script>
  <script src="rules.js"></script>
  <script src="popup.js"></script>
</body>
</html>
